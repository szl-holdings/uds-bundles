# Self-contained smoke workload for the deploy-proof CI gate.
# Hardened to satisfy restricted PodSecurity (non-root, no privilege escalation,
# read-only rootfs with emptyDir scratch). Serves /healthz -> 200 on :8080.
apiVersion: v1
kind: Namespace
metadata:
  name: szl-proof
  labels:
    app.kubernetes.io/part-of: szl-mesh
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smoke-nginx-conf
  namespace: szl-proof
data:
  default.conf: |
    server {
      listen 8080;
      location = /healthz {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","organ":"szl-deploy-proof-smoke"}';
      }
      location / {
        return 200 'szl-deploy-proof-smoke ready\n';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: szl-proof
  namespace: szl-proof
  labels:
    app.kubernetes.io/name: szl-proof
    app.kubernetes.io/part-of: szl-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: szl-proof
  template:
    metadata:
      labels:
        app.kubernetes.io/name: szl-proof
        app.kubernetes.io/part-of: szl-mesh
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: "ghcr.io/nginxinc/nginx-unprivileged:1.27-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - name: nginx-conf
          configMap: { name: smoke-nginx-conf }
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: szl-proof
  namespace: szl-proof
  labels:
    app.kubernetes.io/name: szl-proof
spec:
  selector:
    app.kubernetes.io/name: szl-proof
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
