#
# Canonical UDS Bundles — Build + Publish (a11oy.uds + killinchu.uds)
#
# This workflow builds the TWO canonical INGEST bundles authored under
# bundles/a11oy/ and bundles/killinchu/. It is SEPARATE from
# uds-bundle-publish.yml (which publishes the still-working szl-mesh:0.4.0
# meta-bundle) — that proven workflow is intentionally left UNCHANGED so the
# szl-mesh publish never breaks.
#
# Produces (workflow_dispatch only — never on tag push, to avoid colliding with
# the szl-mesh tag-push trigger):
#   a11oy     -> oci://ghcr.io/szl-holdings/a11oy-bundle:0.5.0     (+ :latest)
#   killinchu -> oci://ghcr.io/szl-holdings/killinchu-bundle:0.5.0 (+ :latest)
#
# NOTE on the -bundle suffix: ghcr.io/szl-holdings/{a11oy,killinchu} already hold
# the organ IMAGES; publishing a UDSBundle to the same path would collide. The
# bundles therefore publish to the *-bundle repos. HONEST: until this workflow
# runs successfully and the tag is verified on GHCR, the bundles are AUTHORED-ONLY.
#
# Doctrine v11 LOCKED 749/14/163 @ c7c0ba17 · Λ = Conjecture 1 · SLSA L1 honest / L2 roadmap (images cosign-signed)
# (bundle build-provenance attestation NOT earned — cosign sig is the provenance).
# Signed-off-by: Stephen P. Lutar Jr. <stephenlutar2@gmail.com>

name: Canonical UDS Bundles (a11oy + killinchu)

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: 'Which canonical bundle to build'
        required: true
        type: choice
        default: a11oy
        options: [a11oy, killinchu]
      version:
        description: 'Bundle version'
        required: false
        default: '0.5.0'

# Least privilege: read-only at the top level; the publish job declares the
# write scopes it needs. (Scorecard Token-Permissions)
permissions:
  contents: read

env:
  UDS_CLI_VERSION: "v0.32.0"
  ZARF_VERSION: "v0.77.0"
  REGISTRY: "ghcr.io"
  ORG: "szl-holdings"

jobs:
  publish:
    name: Build + Publish ${{ inputs.bundle }}.uds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push bundle to ghcr.io
      id-token: write   # keyless cosign OIDC signing
    steps:
      - name: Checkout uds-bundles
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve bundle params
        run: |
          set -euo pipefail
          BUNDLE_NAME="${{ inputs.bundle }}"          # a11oy | killinchu
          BUNDLE_VERSION="${{ inputs.version }}"
          PUBLISH_REPO="${BUNDLE_NAME}-bundle"        # avoid image-vs-bundle collision
          echo "BUNDLE_NAME=${BUNDLE_NAME}"       >> "$GITHUB_ENV"
          echo "BUNDLE_VERSION=${BUNDLE_VERSION}" >> "$GITHUB_ENV"
          echo "PUBLISH_REPO=${PUBLISH_REPO}"     >> "$GITHUB_ENV"
          echo "Building bundles/${BUNDLE_NAME} -> oci://${REGISTRY}/${ORG}/${PUBLISH_REPO}:${BUNDLE_VERSION}"

      - name: Install uds-cli (bundles Zarf v0.77.0)
        run: |
          set -euo pipefail
          curl -sLo /usr/local/bin/uds \
            "https://github.com/defenseunicorns/uds-cli/releases/download/${UDS_CLI_VERSION}/uds-cli_${UDS_CLI_VERSION}_Linux_amd64"
          chmod +x /usr/local/bin/uds
          uds version

      - name: Install Zarf (standalone, for package create)
        run: |
          set -euo pipefail
          curl -sLo /usr/local/bin/zarf \
            "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64"
          chmod +x /usr/local/bin/zarf
          zarf version

      - name: Install cosign (keyless OIDC)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Zarf GHCR auth
        run: zarf tools registry login "${REGISTRY}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" || true

      # The canonical bundle composes the existing, verified per-organ Zarf
      # packages via relative paths (bundles/a11oy/uds-bundle.yaml references
      # ../szl-a11oy, ../szl-sentra, ...). uds create builds each referenced
      # package then composes the bundle.
      # uds create with a UDSBundle `path:` reference expects PRE-BUILT Zarf
      # package tarballs (.tar.zst) to already exist in the referenced dir; it
      # does NOT run `zarf package create` for you. Build each per-organ package
      # the chosen bundle composes FIRST, emitting the tarball into the package
      # dir so the relative `path:` resolves at compose time.
      - name: Build per-organ Zarf packages (tarballs the bundle composes)
        run: |
          set -euo pipefail
          if [ "${BUNDLE_NAME}" = "a11oy" ]; then
            PKGS="szl-a11oy szl-sentra szl-amaru szl-rosie"
          else
            PKGS="szl-killinchu szl-sentra szl-amaru"
          fi
          for p in $PKGS; do
            echo "=== zarf package create bundles/$p ==="
            zarf package create "bundles/$p" -o "bundles/$p" --confirm --no-progress
            ls -lh "bundles/$p"/zarf-package-*.tar.zst
          done

      - name: uds create canonical bundle
        run: |
          set -euo pipefail
          # -o . writes the composed bundle tarball to the repo root (otherwise
          # uds writes it next to the bundle definition under bundles/<name>/).
          uds create "bundles/${BUNDLE_NAME}" -o . --confirm --no-progress
          echo "=== Bundle tarballs ==="
          ls -lh uds-bundle-*.tar.zst

      - name: uds publish bundle to *-bundle repo
        run: |
          set -euo pipefail
          # uds publish tags the artifact by metadata.name and pushes it under the
          # target namespace as <namespace>/<metadata.name>:<version>. Publishing
          # to oci://${REGISTRY}/${ORG} would push to ${ORG}/${BUNDLE_NAME}, which
          # for a11oy/killinchu COLLIDES with the existing ORGAN IMAGE repos
          # (ghcr.io/${ORG}/a11oy already exists and the CI token cannot write it —
          # 403 permission_denied: write_package). Publish instead to a neutral,
          # writable staging namespace ${ORG}/bundles-staging, then copy the bundle
          # to the collision-safe ${PUBLISH_REPO} path that the token CAN write.
          STAGE_NS="${REGISTRY}/${ORG}/bundles-staging"
          for tarball in uds-bundle-*.tar.zst; do
            [ -f "$tarball" ] || continue
            uds publish "$tarball" "oci://${STAGE_NS}"
          done
          SRC="${STAGE_NS}/${BUNDLE_NAME}:${BUNDLE_VERSION}"
          DST="${REGISTRY}/${ORG}/${PUBLISH_REPO}:${BUNDLE_VERSION}"
          zarf tools registry copy "${SRC}" "${DST}"
          zarf tools registry copy "${SRC}" "${REGISTRY}/${ORG}/${PUBLISH_REPO}:latest"

      - name: Cosign sign (keyless OIDC — real bundle provenance)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for tag in "${BUNDLE_VERSION}" "latest"; do
            cosign sign --yes "${REGISTRY}/${ORG}/${PUBLISH_REPO}:${tag}" || \
              echo "::warning::cosign sign failed for :${tag} — published but unsigned for this tag."
          done

      # HONEST: this attestation step requires org-level attestations:write, which
      # the default token LACKS. It is non-blocking and is EXPECTED to fail —
      # the cosign signature above is the real provenance. NOT a bundle SLSA attestation.
      - name: Attest build provenance (EXPECTED to fail — non-blocking)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        continue-on-error: true
        if: hashFiles('uds-bundle-*.tar.zst') != ''
        with:
          subject-path: 'uds-bundle-*.tar.zst'

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Canonical bundle: ${BUNDLE_NAME}.uds v${BUNDLE_VERSION}"
            echo ""
            echo "**Published:** \`oci://${REGISTRY}/${ORG}/${PUBLISH_REPO}:${BUNDLE_VERSION}\` (+ :latest)"
            echo ""
            echo "**Deploy:**"
            echo '```bash'
            echo "uds deploy oci://${REGISTRY}/${ORG}/${PUBLISH_REPO}:${BUNDLE_VERSION} --confirm"
            echo '```'
            echo ""
            echo "Doctrine v11 LOCKED 749/14/163 @ c7c0ba17 · Λ = Conjecture 1 · SLSA L1 honest (images cosign-signed; L2 verification on roadmap, never L2-attested), bundle cosign-signed (no bundle SLSA attestation)."
          } >> "$GITHUB_STEP_SUMMARY"
