name: Cosign keyless OIDC release signing

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

# Least privilege: read-only by default; the signing job declares its writes.
# (Scorecard Token-Permissions)
permissions:
  contents: read

jobs:
  sign:
    name: Sign container image (keyless OIDC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push cosign signature to GHCR
      id-token: write   # OIDC keyless signing
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          echo "Signing ${IMAGE}"
          cosign sign --yes "${IMAGE}"

      - name: Verify signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}"
