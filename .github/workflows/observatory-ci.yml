name: UDS Observatory CI

on:
  pull_request:
    branches: [main]
    paths:
      - "observatory/**"
      - ".github/workflows/observatory-ci.yml"
  push:
    branches: [main]
    paths:
      - "observatory/**"
      - ".github/workflows/observatory-ci.yml"

permissions:
  contents: read

jobs:
  observatory:
    name: observatory/read-only-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            observatory/requirements.txt
            observatory/requirements-dev.txt
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check -r observatory/requirements.txt -r observatory/requirements-dev.txt
      - name: Prove parser, API, and frontend boundaries
        run: |
          python -m compileall -q observatory
          pytest -q observatory/tests
          python - <<'PY'
          from pathlib import Path
          text = (
              Path("observatory/static/index.html").read_text()
              + Path("observatory/static/app.js").read_text()
              + Path("observatory/static/styles.css").read_text()
              + Path("observatory/static/responsive.css").read_text()
          )
          forbidden = (
              "https://",
              "http://",
              "localStorage",
              "sessionStorage",
              "document.cookie",
              "eval(",
          )
          found = [value for value in forbidden if value in text]
          if found:
              raise SystemExit(f"forbidden frontend authority: {found}")
          print("local-only frontend: PASS")
          PY
          git diff --check
