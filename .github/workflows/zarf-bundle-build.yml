# UDS bundle build — additive, dispatchable. Author: Yachay; DCO.
# Action SHAs pinned 2026-06-03 by Auditor BETA (Beta-iter4)
# Produces a cosign-signed Zarf package and anchors its digest in Sigstore Rekor.
name: zarf-bundle-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version tag"
        required: true
        default: "v0.1.0"
      anchor_rekor:
        description: "Anchor the bundle digest in the public Sigstore Rekor log"
        type: boolean
        default: true

permissions:
  contents: read
  packages: read
  id-token: write   # enables keyless/tlog operations

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Zarf
        uses: defenseunicorns/setup-zarf@745f0990f3d0611774b552930ea053ac61ebf0a6 # main 2025-05-12
        with:
          version: v0.51.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.4.1

      - name: Zarf package create (per-flagship dirs in uds-bundles/PER_BUNDLE/*)
        run: |
          mkdir -p dist
          for d in uds-bundles/PER_BUNDLE/*/; do
            [ -f "$d/zarf.yaml" ] || continue
            zarf package create "$d" --confirm -o dist
          done
          # if a consolidated root zarf.yaml exists, build it too
          [ -f zarf.yaml ] && zarf package create . --confirm -o dist || true
          PKG=$(ls dist/zarf-package-*.tar.zst | head -1)
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          for p in dist/zarf-package-*.tar.zst; do sha256sum "$p" | tee "$p.sha256"; done

      # LOUD GUARD (no silent green): COSIGN_KEY is REQUIRED for key-based signing.
      # If it is missing/empty we FAIL the job here with an actionable founder
      # message rather than writing an empty cosign.key and shipping an
      # effectively-unsigned bundle behind an opaque cosign error.
      - name: Require COSIGN_KEY (fail loudly if missing)
        if: ${{ secrets.COSIGN_KEY == '' }}
        run: |
          echo "::error title=COSIGN_KEY missing::This workflow signs the Zarf bundle with a key-based cosign signature, but the COSIGN_KEY secret is not set."
          echo "::error::Founder action required: add the repo/org secret COSIGN_KEY (the cosign PRIVATE key PEM) and COSIGN_PASSWORD."
          echo "::error::Generate with: cosign generate-key-pair  (store ONLY the private cosign.key in secrets; commit/publish cosign.pub)."
          echo "::error::See szl-holdings FOUNDER_SECRETS_RUNBOOK.md. Refusing to emit an unsigned/falsely-signed bundle."
          exit 1

      - name: Cosign sign-blob (key from secret; Rekor anchor optional)
        if: ${{ secrets.COSIGN_KEY != '' }}
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          set -euo pipefail
          # Belt-and-braces runtime guard in addition to the step-level `if:`.
          if [ -z "${COSIGN_KEY:-}" ]; then
            echo "::error::COSIGN_KEY resolved empty at runtime — refusing to write an empty key. Failing loudly."
            exit 1
          fi
          printf '%s' "$COSIGN_KEY" > cosign.key
          trap 'rm -f cosign.key' EXIT
          if [ "${{ inputs.anchor_rekor }}" = "true" ]; then
            cosign sign-blob --key cosign.key --tlog-upload=true \
              --rekor-url=https://rekor.sigstore.dev \
              --bundle "${PKG}.rekor.bundle" --yes "${PKG}.sha256" > "${PKG}.sig"
          else
            cosign sign-blob --key cosign.key --tlog-upload=false --yes "${PKG}" > "${PKG}.sig"
          fi
          rm -f cosign.key

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: szl-uds-bundle-${{ inputs.version }}
          path: |
            dist/zarf-package-*.tar.zst
            dist/zarf-package-*.tar.zst.sig
            dist/zarf-package-*.tar.zst.sha256
            dist/zarf-package-*.tar.zst.rekor.bundle
          if-no-files-found: error
