name: gitleaks

# Secret scanning via gitleaks-action. PR + nightly.
# Allow-list in .gitleaks.toml (cosign.pub PEM blocks). ADDITIVE. Doctrine v11 LOCKED 749/14/163 locked_at c7c0ba17
# NOTE: gitleaks-action v2.3.9 requires GITLEAKS_LICENSE for paid scan mode.
# We run in free/OSS mode: pass GITHUB_TOKEN (no license secret required).

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '7 1 * * *'   # nightly 01:07 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE not set — OSS repos run in free mode via GITHUB_TOKEN
