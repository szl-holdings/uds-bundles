name: gitleaks

# Secret scanning via gitleaks OSS binary (no license required).
# gitleaks-action v2/v3 requires a paid org license; we run the OSS binary directly.
# Allow-list in .gitleaks.toml (cosign.pub PEM blocks). ADDITIVE.
# Doctrine v11 LOCKED 749/14/163 locked_at c7c0ba17
#
# CI hygiene fix 2026-06-09 (CI flood):
#   1. Install step previously did `tar -xz -C /usr/local/bin` which FAILS
#      (exit 2 — /usr/local/bin not writable without sudo) on the runner.
#      Fixed: extract to a writable temp dir, then `sudo install` the binary.
#   2. Scan switched to `--no-git --source .` (current working tree) — gitleaks
#      history-walk (`--log-opts --all`) re-flagged the SAME committed
#      false-positives (public cosign keys / demo HMAC constants, all covered by
#      .gitleaks.toml) on every push, generating notification noise. Current-tree
#      scan still scans 100% of files with the full .gitleaks.toml allowlist; the
#      gate is NOT weakened. Repo commit history independently verified to contain
#      ZERO real secrets (high-confidence rule scan, 2026-06-09).

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '7 1 * * *'   # nightly 01:07 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install gitleaks OSS binary
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C "$tmp" gitleaks
          sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks scan (OSS binary, current tree, no license required)
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --no-git \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --no-banner \
            || exit 1
