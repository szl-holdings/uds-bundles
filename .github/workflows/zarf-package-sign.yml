#
# zarf-package-sign.yml — Keyless cosign signing for SZL UDS bundle packages
#
# Triggered on push to main or workflow_dispatch. Builds Zarf packages for
# all 5 SZL flagship bundles and signs them keyless via GitHub OIDC (Sigstore Fulcio).
#
# This workflow supersedes the key-based signing in zarf-bundle-build.yml:
#   - No COSIGN_KEY secret required
#   - Certificate identity = workflow URL (from GitHub OIDC claim)
#   - Transparency log entry created in Rekor (public audit trail)
#   - Signing bundle (.cosign.bundle) is self-contained for offline verification
#
# Verification for any signed package:
#   cosign verify-blob \
#     --bundle <pkg>.cosign.bundle \
#     --certificate-identity "https://github.com/szl-holdings/uds-bundles/.github/workflows/zarf-package-sign.yml@refs/heads/main" \
#     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
#     <pkg>
#
# Refs:
#   Zarf v0.77.0: https://github.com/zarf-dev/zarf/releases/tag/v0.77.0
#   Keyless docs: https://docs.sigstore.dev/cosign/signing/keyless/
#   SZL_OPERATIONAL_UPGRADES.md U3 (P0, M)

name: Zarf Package Build + Sign (Keyless)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only at the top level; the package-sign job declares the
# write scopes it needs. (Scorecard Token-Permissions)
permissions:
  contents: read

env:
  ZARF_VERSION: "v0.77.0"
  COSIGN_VERSION: "v2.4.3"
  SYFT_VERSION: "v1.18.1"
  REGISTRY: "ghcr.io"
  ORG: "szl-holdings"

jobs:
  package-sign:
    name: Build & Sign (${{ matrix.flagship }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token exchange with Fulcio (keyless signing)
      contents: read    # checkout
      packages: write   # push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        flagship: [a11oy, sentra, amaru, rosie, killinchu, a11oy-memory, a11oy-sentinel, a11oy-operator]

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ── Install Zarf v0.77.0 ─────────────────────────────────────────────
      - name: Install Zarf
        run: |
          set -euo pipefail
          curl -sLo /usr/local/bin/zarf \
            https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64
          chmod +x /usr/local/bin/zarf
          zarf version

      # ── Install cosign ────────────────────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # ── Install syft (SBOM generator) ─────────────────────────────────────
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      # ── Log in to ghcr.io ─────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build Zarf package for this flagship ──────────────────────────────
      - name: Build Zarf package (bundles/szl-${{ matrix.flagship }})
        env:
          FLAGSHIP: ${{ matrix.flagship }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BUNDLE_DIR="bundles/szl-${FLAGSHIP}"
          if [ ! -f "${BUNDLE_DIR}/zarf.yaml" ]; then
            echo "ERROR: ${BUNDLE_DIR}/zarf.yaml not found"
            exit 1
          fi
          zarf package create "${BUNDLE_DIR}" \
            --confirm \
            --no-progress \
            --output-directory ./dist
          PKG=$(ls dist/zarf-package-szl-${FLAGSHIP}*.tar.zst 2>/dev/null | head -1)
          if [ -z "${PKG}" ]; then
            echo "ERROR: No package built for ${FLAGSHIP}"
            ls dist/ || true
            exit 1
          fi
          echo "PKG_FILE=$(basename ${PKG})" >> "$GITHUB_ENV"
          echo "Built: ${PKG}"

      # ── Generate SBOM ─────────────────────────────────────────────────────
      - name: Generate SBOM
        run: |
          set -euo pipefail
          SBOM="dist/${PKG_FILE%.tar.zst}.sbom.spdx.json"
          syft "bundles/szl-${{ matrix.flagship }}" -o spdx-json --file "${SBOM}"
          echo "SBOM_FILE=$(basename ${SBOM})" >> "$GITHUB_ENV"

      # ── Keyless sign package ──────────────────────────────────────────────
      - name: Sign Zarf package (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          PKG="dist/${PKG_FILE}"
          BUNDLE="${PKG}.cosign.bundle"

          cosign sign-blob \
            --yes \
            --bundle "${BUNDLE}" \
            "${PKG}"

          echo "Signed: ${PKG}"
          CERT_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/zarf-package-sign.yml@refs/heads/main"
          CERT_ISSUER="https://token.actions.githubusercontent.com"
          cat >> "${GITHUB_STEP_SUMMARY}" <<SUMMARY
          ### Signed: ${PKG_FILE}

          \`\`\`bash
          cosign verify-blob \\
            --bundle dist/${PKG_FILE}.cosign.bundle \\
            --certificate-identity "${CERT_IDENTITY}" \\
            --certificate-oidc-issuer "${CERT_ISSUER}" \\
            dist/${PKG_FILE}
          \`\`\`
          SUMMARY

      # ── Attest SBOM (DSSE) ────────────────────────────────────────────────
      - name: Attest SBOM (keyless DSSE)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          PKG="dist/${PKG_FILE}"
          SBOM="dist/${SBOM_FILE}"

          cosign attest-blob \
            --yes \
            --predicate "${SBOM}" \
            --type spdxjson \
            --bundle "${PKG}.sbom.bundle" \
            "${PKG}"

      # ── Verify the keyless signature + SBOM attestation (fails on bad verify) ──
      # This proves "verify clean" in-CI for every flagship (incl. the a11oy
      # vertical bundles). The job fails if the signature or attestation does
      # not verify against the workflow's OIDC certificate identity.
      - name: Verify signed package + attestation (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          PKG="dist/${PKG_FILE}"
          CERT_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/zarf-package-sign.yml@refs/heads/main"
          CERT_ISSUER="https://token.actions.githubusercontent.com"

          echo "::group::cosign verify-blob (${PKG_FILE})"
          cosign verify-blob \
            --bundle "${PKG}.cosign.bundle" \
            --certificate-identity "${CERT_IDENTITY}" \
            --certificate-oidc-issuer "${CERT_ISSUER}" \
            "${PKG}"
          echo "::endgroup::"

          # cosign's verify-blob-attestation re-reads the subject blob to check
          # the in-toto subject claim and trips its 128MiB per-blob read limit on
          # the large organ packages; cosign v2.4.3 has no --hash for this
          # subcommand. Split the check into two honest steps with NO loss of
          # binding (arguably stronger, since the binding is made explicit):
          #   1. cryptographically verify the SBOM attestation (signature + OIDC
          #      cert identity + Rekor) WITHOUT the blob (--check-claims=false);
          #   2. decode the just-verified attestation's in-toto subject digest and
          #      assert it equals the package's actual sha256.
          DIGEST="$(sha256sum "${PKG}" | awk '{print $1}')"
          echo "::group::cosign verify-blob-attestation SBOM (${PKG_FILE}) sha256=${DIGEST}"
          cosign verify-blob-attestation \
            --bundle "${PKG}.sbom.bundle" \
            --type spdxjson \
            --check-claims=false \
            --certificate-identity "${CERT_IDENTITY}" \
            --certificate-oidc-issuer "${CERT_ISSUER}"
          echo "Attestation signature + OIDC identity verified; checking subject binding..."
          SUBJECT_SHA="$(python3 - "${PKG}.sbom.bundle" <<'PY'
          import base64, json, sys
          # The cosign --bundle JSON shape varies (new Sigstore bundle has a
          # top-level dsseEnvelope.payload; the legacy cosign bundle wraps the
          # whole DSSE envelope inside base64Signature). Recursively scan every
          # string, base64-decode, and pick the in-toto Statement (has subject[]),
          # unwrapping a DSSE envelope (has payload) one level if needed.
          raw = open(sys.argv[1], "rb").read()
          def b64try(s):
              try:
                  return base64.b64decode(s, validate=False)
              except Exception:
                  return None
          def jtry(bs):
              try:
                  return json.loads(bs)
              except Exception:
                  return None
          found = []
          def walk(o):
              if isinstance(o, dict):
                  for v in o.values():
                      walk(v)
              elif isinstance(o, list):
                  for v in o:
                      walk(v)
              elif isinstance(o, str):
                  bs = b64try(o)
                  if bs is None:
                      return
                  j = jtry(bs)
                  if isinstance(j, dict):
                      if isinstance(j.get("subject"), list):
                          found.append(j)
                      elif isinstance(j.get("payload"), str):
                          inner = jtry(b64try(j["payload"]) or b"")
                          if isinstance(inner, dict) and isinstance(inner.get("subject"), list):
                              found.append(inner)
          top = jtry(raw)
          if top is None:
              sys.stderr.write("bundle is not JSON\n")
              sys.exit(2)
          walk(top)
          if not found:
              sys.stderr.write("no in-toto statement found in bundle\n")
              sys.exit(2)
          print(found[0]["subject"][0]["digest"]["sha256"])
          PY
          )"
          if [ "${SUBJECT_SHA}" != "${DIGEST}" ]; then
            echo "::error::SBOM attestation subject digest (${SUBJECT_SHA}) != package sha256 (${DIGEST})"
            exit 1
          fi
          echo "Subject binding OK: ${SUBJECT_SHA}"
          echo "::endgroup::"

          {
            echo "### ✅ Verified clean: ${PKG_FILE}"
            echo ""
            echo "- \`cosign verify-blob\` — PASS (keyless OIDC, Rekor-logged)"
            echo "- \`cosign verify-blob-attestation\` (spdxjson SBOM) — PASS"
            echo "- certificate-identity: \`${CERT_IDENTITY}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # ── Upload signed artifacts ───────────────────────────────────────────
      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zarf-package-${{ matrix.flagship }}-signed
          retention-days: 14
          path: |
            dist/zarf-package-*.tar.zst
            dist/zarf-package-*.cosign.bundle
            dist/zarf-package-*.sbom.bundle
            dist/*.sbom.spdx.json
