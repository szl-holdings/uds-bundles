name: SBOM — CycloneDX via Syft

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: read-only by default; the sbom job needs the write scopes.
# (Scorecard Token-Permissions)
permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload-release-assets on release
      packages: read
      id-token: write   # SBOM attestation (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate SBOM with Syft (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.17.0
        with:
          output-file: sbom.cdx.json
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
          upload-artifact: true
          upload-release-assets: true

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
