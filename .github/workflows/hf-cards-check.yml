name: HF Dataset Cards Check

# Claim checks for the Hugging Face dataset cards sourced in huggingface/datasets/.
# Stdlib-only unittest; no network, no credentials, no publishing.
on:
  pull_request:
    branches: [main]
    paths:
      - "huggingface/**"
      - "tests/test_hf_dataset_cards.py"
      - "COSIGN_KEYS.md"
      - "bundles/v0.1.0/cosign_signing_key.pub"
      - "uds-bundles/artifacts/DEPLOY_DRYRUN.txt"
      - ".github/workflows/hf-cards-check.yml"
      # Evidence the claim checks read: the air-gap proof receipt, the proof-package
      # artifacts and logs, and the key map and signing log.
      - "releases/szl-warhacker-uds-v1.0.0/airgap-proof/**"
      - "uds-bundles/artifacts/**"
      - "uds-bundles/COSIGN_SIGNING_LOG.md"
      - "uds-bundles/GAP_CHECK.md"
      - "COSIGN_KEYS.md"
      - "bundles/v0.1.0/cosign_signing_key.pub"
  push:
    branches: [main]
    paths:
      - "huggingface/**"
      - "tests/test_hf_dataset_cards.py"
      - "COSIGN_KEYS.md"
      - "bundles/v0.1.0/cosign_signing_key.pub"
      - "uds-bundles/artifacts/DEPLOY_DRYRUN.txt"
      - ".github/workflows/hf-cards-check.yml"
      # Evidence the claim checks read: the air-gap proof receipt, the proof-package
      # artifacts and logs, and the key map and signing log.
      - "releases/szl-warhacker-uds-v1.0.0/airgap-proof/**"
      - "uds-bundles/artifacts/**"
      - "uds-bundles/COSIGN_SIGNING_LOG.md"
      - "uds-bundles/GAP_CHECK.md"
      - "COSIGN_KEYS.md"
      - "bundles/v0.1.0/cosign_signing_key.pub"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cards:
    name: hf-cards/claim-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
      - name: Check card claims against repository evidence
        run: python -m unittest discover -v -s tests -p test_hf_dataset_cards.py
