name: Helm Lint + Chart Test

# Lints + chart-tests the SZL umbrella Helm chart (charts/szl) on every PR and
# packages szl-0.1.0.tgz as a release asset. Big Bang chart parity gate.
# Author: Yachay <yachay@szlholdings.dev> (DCO signed). ADDITIVE.

on:
  push:
    branches: [main]
    paths: ["charts/**", "bigbang/**", ".github/workflows/helm-lint.yml", "scripts/helm_evidence.py", "tests/test_helm_evidence.py"]
  pull_request:
    branches: [main]
    paths: ["charts/**", "bigbang/**", ".github/workflows/helm-lint.yml", "scripts/helm_evidence.py", "tests/test_helm_evidence.py"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: helm lint + ct lint + template render
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.0

      - name: helm lint
        run: helm lint ./charts/szl

      - name: Offline evidence consumer and negative tests
        run: python3 -m unittest discover -s tests -p test_helm_evidence.py -v

      - name: Package and verify chart-file evidence (unsigned)
        run: |
          mkdir -p dist
          helm package ./charts/szl -d dist
          chart=(dist/*.tgz)
          test "${#chart[@]}" -eq 1
          source_sha="$(git rev-parse HEAD)"
          python3 scripts/helm_evidence.py generate "${chart[0]}" --source-sha "$source_sha"
          python3 scripts/helm_evidence.py verify "${chart[0]}" --source-sha "$source_sha" --artifact-sha256 "$(sha256sum "${chart[0]}" | cut -d ' ' -f1)"

      - name: helm template (render gate — fail on empty render)
        run: |
          helm template bigbang-szl ./charts/szl --namespace szl-system > /tmp/rendered.yaml
          test "$(grep -c '^kind:' /tmp/rendered.yaml)" -ge 40

      - name: Set up chart-testing (ct)
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: ct lint
        run: |
          ct lint --charts ./charts/szl --validate-maintainers=false --target-branch main || \
          ct lint --charts ./charts/szl --validate-maintainers=false --all

      - name: kustomize render (Big Bang overlay)
        run: kubectl kustomize ./bigbang > /tmp/bigbang.yaml && test -s /tmp/bigbang.yaml

  package:
    name: package + attach szl-0.1.0.tgz
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.0
      - name: Package with unsigned SBOM evidence
        run: |
          mkdir -p dist
          helm package ./charts/szl -d dist
          chart=(dist/*.tgz)
          test "${#chart[@]}" -eq 1
          source_sha="$(git rev-parse HEAD)"
          python3 scripts/helm_evidence.py generate "${chart[0]}" --source-sha "$source_sha"
          python3 scripts/helm_evidence.py verify "${chart[0]}" --source-sha "$source_sha" --artifact-sha256 "$(sha256sum "${chart[0]}" | cut -d ' ' -f1)"
          cp LICENSE scripts/helm_evidence.py dist/
      - name: Attach chart and evidence to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        # Refuse replacement of existing release assets. No new signing permissions.
        run: gh release upload "$RELEASE_TAG" dist/*
