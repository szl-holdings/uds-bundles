name: Release artifacts (SBOM + attestation)
on:
  release:
    types: [created, published]
  workflow_dispatch:
# Least privilege: read-only at the top level; the attest job declares the
# write scopes it needs. (Scorecard Token-Permissions)
permissions:
  contents: read
jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # OIDC keyless signing / attestation
      contents: write       # upload release assets
      packages: write       # registry push for attestation subjects
      attestations: write   # actions/attest-* write attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.17.9
        with:
          format: cyclonedx-json
          output-file: ${{ github.event.repository.name }}.sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: '${{ github.event.repository.name }}.sbom.cdx.json'
          push-to-registry: false

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: '${{ github.event.repository.name }}.sbom.cdx.json'
          sbom-path: '${{ github.event.repository.name }}.sbom.cdx.json'

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Cosign attest SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest-blob --yes \
            --predicate ${{ github.event.repository.name }}.sbom.cdx.json \
            --type cyclonedx \
            --output-attestation ${{ github.event.repository.name }}.intoto.jsonl \
            ${{ github.event.repository.name }}.sbom.cdx.json

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: github.event_name == 'release'
        with:
          files: |
            ${{ github.event.repository.name }}.sbom.cdx.json
            ${{ github.event.repository.name }}.intoto.jsonl
