name: UDS Bundle Observatory v2 qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "frontier/uds_observatory_v2/**"
      - ".github/workflows/uds-observatory-v2.yml"
      - "FRONTIER_PLAN.md"
  push:
    branches: [main]
    paths:
      - "frontier/uds_observatory_v2/**"
      - ".github/workflows/uds-observatory-v2.yml"
      - "FRONTIER_PLAN.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uds-observatory-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: uds-observatory-v2/qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: frontier/uds_observatory_v2/requirements.txt

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --requirement frontier/uds_observatory_v2/requirements.txt

      - name: Prove parser API and receipt contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            frontier/uds_observatory_v2/app.py \
            frontier/uds_observatory_v2/parser.py \
            frontier/uds_observatory_v2/tests/test_observatory.py
          python -m pytest -q frontier/uds_observatory_v2/tests

      - name: Prove local-only responsive interface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          html = Path('frontier/uds_observatory_v2/static/index.html').read_text()
          js = Path('frontier/uds_observatory_v2/static/app.js').read_text()
          css = Path('frontier/uds_observatory_v2/static/styles.css').read_text()
          forbidden = ('http://', 'https://', '<iframe', 'analytics', 'localStorage', 'sessionStorage')
          present = [value for value in forbidden if value in html]
          if present:
              raise SystemExit(f'forbidden frontend dependencies: {present}')
          required_html = ('viewport-fit=cover', 'skip-link', 'aria-live', '/styles.css', '/app.js')
          missing = [value for value in required_html if value not in html]
          if missing:
              raise SystemExit(f'missing accessibility primitives: {missing}')
          required_css = (
              '@media (max-width: 32rem)',
              '@media (prefers-reduced-motion: reduce)',
              '@media (prefers-contrast: more)',
              '@media (forced-colors: active)',
              '@media (pointer: coarse)',
              '@media print',
              ':focus-visible',
          )
          missing_css = [value for value in required_css if value not in css]
          if missing_css:
              raise SystemExit(f'missing responsive contracts: {missing_css}')
          for sink in ('innerHTML', 'insertAdjacentHTML', 'document.write'):
              if sink in js:
                  raise SystemExit(f'unsafe dynamic sink present: {sink}')
          print('frontend qualification: PASS')
          PY

      - name: Verify fail-closed authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = '\n'.join([
              Path('frontier/uds_observatory_v2/app.py').read_text(),
              Path('frontier/uds_observatory_v2/parser.py').read_text(),
          ])
          forbidden = (
              'subprocess.', 'os.system(', 'eval(', 'exec(',
              'kubernetes', 'kubectl', 'zarf package deploy',
              'docker push', 'oras push', 'requests.', 'urllib.request',
              'Authorization', 'GH_TOKEN', 'HF_TOKEN',
          )
          present = [value for value in forbidden if value in source]
          if present:
              raise SystemExit(f'forbidden runtime authority: {present}')
          required = (
              'MAX_INPUT_BYTES', 'MAX_FILE_BYTES', 'MAX_DEPTH', 'MAX_ALIASES',
              'duplicate JSON key', 'duplicate YAML key',
              'UNAVAILABLE_NOT_VERIFIED', 'NOT_ATTEMPTED',
              'mutation_authority', 'cluster_authority', 'registry_authority',
          )
          missing = [value for value in required if value not in source]
          if missing:
              raise SystemExit(f'missing fail-closed contracts: {missing}')
          print('authority qualification: PASS')
          PY

      - name: Build non-root container
        shell: bash
        run: |
          set -euo pipefail
          docker build --file frontier/uds_observatory_v2/Dockerfile --tag uds-observatory-v2:${GITHUB_SHA} .
          test "$(docker image inspect --format '{{.Config.User}}' uds-observatory-v2:${GITHUB_SHA})" = "10002:10002"

      - name: Verify clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
