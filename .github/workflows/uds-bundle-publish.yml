#
# UDS Bundle Build + Publish workflow
#
# Produces: oci://ghcr.io/szl-holdings/szl-uds-bundle:uds-v0.2.0
#
# Triggers:
#   - push tag matching uds-v*
#   - workflow_dispatch (manual)
#
# Requires:
#   - All 5 flagship images in GHCR (ghcr.io/szl-holdings/{a11oy,sentra,amaru,rosie,killinchu}:uds-v0.2.0)
#   - org-level packages: write permission for GITHUB_TOKEN (or GHCR_TOKEN secret)
#
# HONEST DISCLOSURE: if flagship images are not in GHCR, `uds bundle create` will
# fail at image reference resolution. See FINAL_REPORT.md Task 1 blocker.
#
# Doctrine v11 LOCKED 749/14/163 at kernel commit c7c0ba17
# SLSA L1 honest — not L3
# Signed-off-by: Yachay <yachay@szlholdings.ai>
# Co-Authored-By: Perplexity Computer Agent <agent@perplexity.ai>

name: UDS Bundle Build + Publish

on:
  push:
    tags: ['uds-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bundle tag (e.g. uds-v0.2.0)'
        required: false
        default: 'uds-v0.2.0'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  UDS_CLI_VERSION: "v0.27.0"
  ZARF_VERSION: "v0.77.0"
  REGISTRY: "ghcr.io"
  ORG: "szl-holdings"
  BUNDLE_NAME: "szl-uds-bundle"

jobs:
  publish:
    name: Build + Publish UDS Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uds-cli
        run: |
          set -euo pipefail
          curl -sLo /usr/local/bin/uds \
            "https://github.com/defenseunicorns/uds-cli/releases/download/${UDS_CLI_VERSION}/uds-cli_${UDS_CLI_VERSION}_Linux_amd64"
          chmod +x /usr/local/bin/uds
          uds version

      - name: Install Zarf
        run: |
          set -euo pipefail
          curl -sLo /usr/local/bin/zarf \
            "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64"
          chmod +x /usr/local/bin/zarf
          zarf version

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bundle tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUNDLE_TAG="${{ inputs.tag }}"
          else
            BUNDLE_TAG="${GITHUB_REF_NAME}"
          fi
          echo "BUNDLE_TAG=${BUNDLE_TAG}" >> "$GITHUB_ENV"
          echo "Bundle tag: ${BUNDLE_TAG}"

      - name: uds bundle create
        run: |
          set -euo pipefail
          # Create from root uds-bundle.yaml
          uds bundle create . --confirm --no-progress
          echo "Created bundle files:"
          ls -la *.tar.zst 2>/dev/null || echo "No .tar.zst found"

      - name: uds bundle publish
        run: |
          set -euo pipefail
          for tarball in *.tar.zst; do
            if [ -f "$tarball" ]; then
              echo "Publishing $tarball to oci://${REGISTRY}/${ORG}"
              uds bundle publish "$tarball" "oci://${REGISTRY}/${ORG}"
              echo "Published: oci://${REGISTRY}/${ORG}/${BUNDLE_NAME}:${BUNDLE_TAG}"
            fi
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1

      - name: Cosign sign bundle (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          # Sign the published OCI bundle artifact
          TARGET="${REGISTRY}/${ORG}/${BUNDLE_NAME}:${BUNDLE_TAG}"
          echo "Signing: ${TARGET}"
          cosign sign --yes "${TARGET}" || {
            echo "cosign sign failed for ${TARGET}"
            echo "This may occur if the package is private or OIDC token scope is insufficient."
            echo "Bundle is published; signing failure is non-blocking."
          }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '*.tar.zst'

      - name: Bundle summary
        run: |
          echo "### UDS Bundle Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Artifact:** \`oci://${REGISTRY}/${ORG}/${BUNDLE_NAME}:${BUNDLE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Verify:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "cosign verify ${REGISTRY}/${ORG}/${BUNDLE_NAME}:${BUNDLE_TAG} \\" >> "$GITHUB_STEP_SUMMARY"
          echo '  --certificate-identity-regexp="^https://github.com/szl-holdings/" \' >> "$GITHUB_STEP_SUMMARY"
          echo '  --certificate-oidc-issuer="https://token.actions.githubusercontent.com"' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
