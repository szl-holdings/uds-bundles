#
# UDS Bundle Build + Publish workflow
#
# Produces: oci://ghcr.io/szl-holdings/szl-uds-bundle:uds-v0.2.0
#
# uds-cli v0.27.0 API:
#   uds create . --confirm           (was: uds bundle create)
#   uds publish <tarball> <oci://..> (was: uds bundle publish)
#
# HONEST DISCLOSURE: `uds create` will fail if referenced Zarf packages
# embed images that don't resolve (a11oy/sentra/amaru GHCR blocker).
# This workflow is wired and ready; the GHCR org setting must be fixed
# by the founder before it can fully succeed.
#
# Doctrine v11 LOCKED 749/14/163 at kernel commit c7c0ba17
# SLSA L1 honest — not L3
# Signed-off-by: Yachay <yachay@szlholdings.ai>
# Co-Authored-By: Perplexity Computer Agent <agent@perplexity.ai>

name: UDS Bundle Build + Publish

on:
  push:
    tags: ['uds-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bundle tag (e.g. uds-v0.2.0)'
        required: false
        default: 'uds-v0.2.0'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  UDS_CLI_VERSION: "v0.27.0"
  ZARF_VERSION: "v0.77.0"
  REGISTRY: "ghcr.io"
  ORG: "szl-holdings"
  BUNDLE_NAME: "szl-uds-bundle"

jobs:
  publish:
    name: Build + Publish UDS Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uds-cli v0.27.0
        run: |
          set -euo pipefail
          curl -sLo /usr/local/bin/uds \
            "https://github.com/defenseunicorns/uds-cli/releases/download/${UDS_CLI_VERSION}/uds-cli_${UDS_CLI_VERSION}_Linux_amd64"
          chmod +x /usr/local/bin/uds
          uds version

      - name: Install Zarf v0.77.0
        run: |
          set -euo pipefail
          curl -sLo /usr/local/bin/zarf \
            "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64"
          chmod +x /usr/local/bin/zarf
          zarf version

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bundle tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUNDLE_TAG="${{ inputs.tag }}"
          else
            BUNDLE_TAG="${GITHUB_REF_NAME}"
          fi
          echo "BUNDLE_TAG=${BUNDLE_TAG}" >> "$GITHUB_ENV"
          echo "Bundle tag: ${BUNDLE_TAG}"

      - name: uds create (bundle from root uds-bundle.yaml)
        run: |
          set -euo pipefail
          # uds-cli v0.27.0: `uds create` for bundle creation (not `uds bundle create`)
          uds create . --confirm --no-progress
          echo "Bundle tarballs:"
          ls -la *.tar.zst 2>/dev/null || echo "WARNING: No .tar.zst created"

      - name: uds publish (bundle to OCI)
        run: |
          set -euo pipefail
          PUBLISHED=0
          for tarball in *.tar.zst; do
            if [ -f "$tarball" ]; then
              echo "Publishing $tarball to oci://${REGISTRY}/${ORG}"
              # uds-cli v0.27.0: `uds publish` (not `uds bundle publish`)
              uds publish "$tarball" "oci://${REGISTRY}/${ORG}"
              echo "Published: oci://${REGISTRY}/${ORG}/${BUNDLE_NAME}:${BUNDLE_TAG}"
              PUBLISHED=$((PUBLISHED + 1))
            fi
          done
          if [ "$PUBLISHED" -eq 0 ]; then
            echo "ERROR: No tarballs to publish"
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1

      - name: Cosign sign bundle (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          TARGET="${REGISTRY}/${ORG}/${BUNDLE_NAME}:${BUNDLE_TAG}"
          echo "Signing: ${TARGET}"
          cosign sign --yes "${TARGET}" || {
            echo "WARNING: cosign sign failed for ${TARGET} — non-blocking"
            echo "Bundle is published but not signed. Likely causes:"
            echo "  - Package visibility (private) prevents cosign OIDC"
            echo "  - GHCR org write_package setting"
          }

      - name: Attest build provenance (SLSA L1)
        uses: actions/attest-build-provenance@v2
        if: hashFiles('*.tar.zst') != ''
        with:
          subject-path: '*.tar.zst'

      - name: Summary
        if: always()
        run: |
          {
            echo "### UDS Bundle Publish"
            echo "**Artifact:** \`oci://${REGISTRY}/${ORG}/${BUNDLE_NAME}:${BUNDLE_TAG}\`"
            echo ""
            echo "**Verify cosign signature:**"
            echo '```bash'
            echo "cosign verify ${REGISTRY}/${ORG}/${BUNDLE_NAME}:${BUNDLE_TAG} \\"
            echo '  --certificate-identity-regexp="^https://github.com/szl-holdings/" \'
            echo '  --certificate-oidc-issuer="https://token.actions.githubusercontent.com"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
