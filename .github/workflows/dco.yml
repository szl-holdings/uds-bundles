name: DCO

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Validate every commit sign-off
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_COMMITS: ${{ github.event.pull_request.commits }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          import os
          import re
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          pr_number = int(os.environ["PR_NUMBER"])
          expected_head = os.environ["EXPECTED_HEAD"]
          expected_commits = int(os.environ["EXPECTED_COMMITS"])
          signoff = re.compile(
              r"^Signed-off-by:\s*([^<\r\n]+?)\s*<([^<>\s]+@[^<>\s]+)>\s*$",
              re.IGNORECASE | re.MULTILINE,
          )

          DEPENDABOT_LOGIN = "dependabot[bot]"
          DEPENDABOT_ID = 49699333
          DEPENDABOT_AUTHOR_EMAIL = (
              "49699333+dependabot[bot]@users.noreply.github.com"
          )
          DEPENDABOT_SIGNOFF_EMAIL = "support@github.com"

          def is_verified_dependabot_signoff(pr, row, signoff_emails):
              """Recognize GitHub's exact, signed Dependabot identity mapping."""
              pr_user = pr.get("user") or {}
              api_author = row.get("author") or {}
              api_committer = row.get("committer") or {}
              commit = row.get("commit") or {}
              commit_author = commit.get("author") or {}
              commit_committer = commit.get("committer") or {}
              verification = commit.get("verification") or {}
              return all(
                  (
                      pr_user.get("login") == DEPENDABOT_LOGIN,
                      pr_user.get("id") == DEPENDABOT_ID,
                      api_author.get("login") == DEPENDABOT_LOGIN,
                      api_author.get("id") == DEPENDABOT_ID,
                      api_committer.get("login") in {"web-flow", DEPENDABOT_LOGIN},
                      str(commit_author.get("name") or "") == DEPENDABOT_LOGIN,
                      str(commit_author.get("email") or "").lower()
                      == DEPENDABOT_AUTHOR_EMAIL,
                      str(commit_committer.get("name") or "") == "GitHub",
                      str(commit_committer.get("email") or "").lower()
                      == "noreply@github.com",
                      verification.get("verified") is True,
                      verification.get("reason") == "valid",
                      DEPENDABOT_SIGNOFF_EMAIL in signoff_emails,
                  )
              )

          def self_test_dependabot_identity_mapping():
              valid_pr = {
                  "user": {"login": DEPENDABOT_LOGIN, "id": DEPENDABOT_ID}
              }
              valid_row = {
                  "author": {"login": DEPENDABOT_LOGIN, "id": DEPENDABOT_ID},
                  "committer": {"login": "web-flow", "id": 19864447},
                  "commit": {
                      "author": {
                          "name": DEPENDABOT_LOGIN,
                          "email": DEPENDABOT_AUTHOR_EMAIL,
                      },
                      "committer": {
                          "name": "GitHub",
                          "email": "noreply@github.com",
                      },
                      "verification": {"verified": True, "reason": "valid"},
                  },
              }
              support = {DEPENDABOT_SIGNOFF_EMAIL}
              assert is_verified_dependabot_signoff(valid_pr, valid_row, support)

              wrong_pr = copy.deepcopy(valid_pr)
              wrong_pr["user"]["login"] = "lookalike[bot]"
              assert not is_verified_dependabot_signoff(wrong_pr, valid_row, support)

              unsigned = copy.deepcopy(valid_row)
              unsigned["commit"]["verification"]["verified"] = False
              assert not is_verified_dependabot_signoff(valid_pr, unsigned, support)

              wrong_author = copy.deepcopy(valid_row)
              wrong_author["commit"]["author"]["email"] = "attacker@example.com"
              assert not is_verified_dependabot_signoff(valid_pr, wrong_author, support)

              assert not is_verified_dependabot_signoff(valid_pr, valid_row, set())

          def get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "szl-dco-check/1.1",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          self_test_dependabot_identity_mapping()

          pr = get(f"https://api.github.com/repos/{repository}/pulls/{pr_number}")
          if pr.get("head", {}).get("sha") != expected_head:
              raise SystemExit("pull-request head moved during DCO validation")

          commits = []
          for page in range(1, 4):
              rows = get(
                  f"https://api.github.com/repos/{repository}/pulls/{pr_number}/commits"
                  f"?per_page=100&page={page}"
              )
              if not isinstance(rows, list):
                  raise SystemExit("commit response is not an array")
              commits.extend(rows)
              if len(rows) < 100:
                  break
          if len(commits) != expected_commits:
              raise SystemExit(
                  f"commit count drifted: expected {expected_commits}, observed {len(commits)}"
              )

          failures = []
          bot_attestations = 0
          for row in commits:
              sha = str(row.get("sha", ""))
              commit = row.get("commit") or {}
              message = str(commit.get("message", ""))
              author_email = str(
                  (commit.get("author") or {}).get("email") or ""
              ).lower()
              signoff_emails = {
                  match.group(2).lower() for match in signoff.finditer(message)
              }
              if not signoff_emails:
                  failures.append(f"{sha[:12]}: missing Signed-off-by trailer")
              elif author_email and author_email in signoff_emails:
                  continue
              elif is_verified_dependabot_signoff(pr, row, signoff_emails):
                  bot_attestations += 1
              else:
                  failures.append(
                      f"{sha[:12]}: author email {author_email or '[missing]'} "
                      "is not represented by a valid sign-off identity"
                  )

          if failures:
              raise SystemExit("DCO failures:\n" + "\n".join(failures))
          print(
              json.dumps(
                  {
                      "status": "PASS",
                      "repository": repository,
                      "pull_request": pr_number,
                      "head_sha": expected_head,
                      "commits_verified": len(commits),
                      "verified_dependabot_attestations": bot_attestations,
                      "credential_material_recorded": False,
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
