name: DCO

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Validate every commit sign-off
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_COMMITS: ${{ github.event.pull_request.commits }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          pr_number = int(os.environ["PR_NUMBER"])
          expected_head = os.environ["EXPECTED_HEAD"]
          expected_commits = int(os.environ["EXPECTED_COMMITS"])
          signoff = re.compile(
              r"^Signed-off-by:\s*([^<\r\n]+?)\s*<([^<>\s]+@[^<>\s]+)>\s*$",
              re.IGNORECASE | re.MULTILINE,
          )

          def get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "szl-dco-check/1.0",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          pr = get(f"https://api.github.com/repos/{repository}/pulls/{pr_number}")
          if pr.get("head", {}).get("sha") != expected_head:
              raise SystemExit("pull-request head moved during DCO validation")

          commits = []
          for page in range(1, 4):
              rows = get(
                  f"https://api.github.com/repos/{repository}/pulls/{pr_number}/commits"
                  f"?per_page=100&page={page}"
              )
              if not isinstance(rows, list):
                  raise SystemExit("commit response is not an array")
              commits.extend(rows)
              if len(rows) < 100:
                  break
          if len(commits) != expected_commits:
              raise SystemExit(
                  f"commit count drifted: expected {expected_commits}, observed {len(commits)}"
              )

          failures = []
          for row in commits:
              sha = str(row.get("sha", ""))
              commit = row.get("commit") or {}
              message = str(commit.get("message", ""))
              author_email = str((commit.get("author") or {}).get("email") or "").lower()
              signoff_emails = {match.group(2).lower() for match in signoff.finditer(message)}
              if not signoff_emails:
                  failures.append(f"{sha[:12]}: missing Signed-off-by trailer")
              elif author_email and author_email not in signoff_emails:
                  failures.append(
                      f"{sha[:12]}: author email {author_email} is not represented by a sign-off"
                  )

          if failures:
              raise SystemExit("DCO failures:\n" + "\n".join(failures))
          print(
              json.dumps(
                  {
                      "status": "PASS",
                      "repository": repository,
                      "pull_request": pr_number,
                      "head_sha": expected_head,
                      "commits_verified": len(commits),
                      "credential_material_recorded": False,
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
