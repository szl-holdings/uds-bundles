name: Version Doctrine (canonical uds-v* string)

# Asserts ONE canonical UDS ecosystem version string (./VERSION, e.g. uds-v0.4.0)
# across user-visible docs/config. Signed historical tags (uds-v0.2.0 flagship images,
# uds-v0.1.0/uds-v1.0.0 releases, uds-v0.3.0 signed capstone) are allowlisted —
# FORWARD-ONLY: signed bytes are NEVER renamed. See scripts/check_version_doctrine.sh.
# Author: Yachay <yachay@szlholdings.dev> (DCO signed). ADDITIVE.

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "**/*.md"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.cff"
      - ".github/workflows/version-doctrine.yml"
      - "scripts/check_version_doctrine.sh"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-doctrine:
    name: canonical version-string check
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version doctrine check
        run: bash scripts/check_version_doctrine.sh
