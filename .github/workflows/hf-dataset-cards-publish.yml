name: HF Dataset Cards Publish

# Publishes huggingface/datasets/<id>/README.md (the card only, never the payload) to the
# SZLHOLDINGS Hub datasets. GitHub is the source of truth; the Hub copy is downstream and is
# written only by this workflow. Each upload is read back and must match the git blob.
on:
  push:
    branches: [main]
    paths:
      - "huggingface/datasets/*/README.md"
      - "scripts/hf_publish_cards.py"
      - "tests/test_hf_publish_cards.py"
      - ".github/workflows/hf-dataset-cards-publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "huggingface/datasets/*/README.md"
      - "scripts/hf_publish_cards.py"
      - "tests/test_hf_publish_cards.py"
      - ".github/workflows/hf-dataset-cards-publish.yml"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dry run only: dataset to compare (a write always covers all three cards)"
        type: choice
        default: all
        options: [all, uds-bundles-v1, uds-spans-receipts, uds-governance-receipts]
      dry_run:
        description: "Compare with the Hub only; do not upload"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: hf-cards-publish/test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Publish-script tests (offline)
        run: python -m unittest -v tests/test_hf_publish_cards.py

  publish:
    name: hf-cards-publish/publish
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Writes share one queue. A dry run (or a PR, which never reaches this job) gets a group of
    # its own, so validation never waits behind, displaces or is displaced by a write.
    concurrency:
      group: ${{ (github.event_name == 'pull_request' || inputs.dry_run) && format('hf-dataset-cards-validate-{0}', github.run_id) || 'hf-dataset-cards-publish' }}
      cancel-in-progress: false
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Card claim checks must pass before publishing
        run: |
          if [ ! -f tests/test_hf_dataset_cards.py ]; then
            echo "::error::tests/test_hf_dataset_cards.py is missing; refusing to publish unchecked cards"
            exit 1
          fi
          python -m unittest -v tests/test_hf_dataset_cards.py
      - name: Install huggingface_hub (pinned)
        run: python -m pip install --disable-pip-version-check --no-cache-dir "huggingface_hub==2.0.0"
      - name: Verify current canonical source before loading the publishing token
        run: |
          python - <<'PY'
          import os
          from scripts.hf_publish_cards import DATASETS, ROOT, SourceGuard
          guard = SourceGuard(ROOT, os.environ["GITHUB_SHA"])
          for dataset in DATASETS:
              guard(dataset)
          PY
      - name: Publish cards and verify read-back
        env:
          # Org-level HF_TOKEN only. HF_ORG_TOKEN is not used: it is invalid (HTTP 400).
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          INPUT_DATASET: ${{ inputs.dataset || 'all' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          args=(--git-sha "$GITHUB_SHA" --run-url "$RUN_URL")
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
            # Only a dry run is narrowed. A write covers every card, so it also covers any
            # queued write it displaced from the concurrency group.
            if [ "$INPUT_DATASET" != "all" ]; then args+=(--dataset "$INPUT_DATASET"); fi
          fi
          python scripts/hf_publish_cards.py "${args[@]}" > publish-result.json
          rc=$?
          cat publish-result.json
          {
            echo "### HF dataset cards publish (\`$GITHUB_SHA\`, exit $rc)"
            echo '```json'
            cat publish-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
