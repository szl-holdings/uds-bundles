version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  # Docker base images
  - package-ecosystem: "docker"
    directories:
      - "/uds-bundles/PER_BUNDLE/a11oy"
      - "/uds-bundles/PER_BUNDLE/amaru"
      - "/uds-bundles/PER_BUNDLE/killinchu"
      - "/uds-bundles/PER_BUNDLE/rosie"
      - "/uds-bundles/PER_BUNDLE/sentra"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 3
    groups:
      docker-deps:
        patterns:
          - "*"
