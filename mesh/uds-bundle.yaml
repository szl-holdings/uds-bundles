# SZL Holdings — Top-level UDS bundle
# Authored by: Lutar, Stephen P. · ORCID 0009-0001-0110-4173 · SZL Holdings
# Status: Real bundle. Promoted from docs/proposals/defense-unicorns/skeletons/uds-bundle.yaml
#         per Plane 1 of the mesh plan (§04). Intended for commit to the new
#         external szl-holdings/uds-mesh repository at the repo root.
#
# Build:  uds-cli bundle create . --confirm
# Deploy: uds-cli bundle deploy uds-bundle-szl-mesh-amd64-0.1.0.tar.zst --confirm
# Verify: uds-cli bundle inspect uds-bundle-szl-mesh-amd64-0.1.0.tar.zst

kind: UDSBundle
metadata:
  name: szl-mesh
  version: 0.1.0
  description: |
    A11oy + Sentra + Amaru composed as a single UDS bundle, with an
    in-bundle hash-chained attestations sidecar verifiable offline
    (no registry round-trip) per §05 Fix A.
  authors: "Lutar, Stephen P. · ORCID 0009-0001-0110-4173 · SZL Holdings"
  architecture: amd64

packages:
  # These three members are sourced from the real, in-repo Zarf packages under
  # `bundles/szl-<organ>/` (the same local-path pattern the canonical published
  # root bundle `szl-mesh:v0.4.0` uses). Each wraps the published, cosign-signed
  # organ image (uds-v0.2.0). uds-cli runs `zarf package create` against the
  # package directory at bundle-build time, so `uds create .` deploys as written.
  #
  # The prior refs `ghcr.io/szl-holdings/packages/<organ>:1.0.0-alpha` were never
  # published — wrong org path (`packages/` prefix) AND no standalone per-organ
  # Zarf package exists on GHCR (only the plain container images do). They are
  # replaced with local paths so the bundle is genuinely deployable.
  - name: szl-a11oy
    path: ../bundles/szl-a11oy
    ref: "0.2.0"
    optionalComponents:
      - a11oy-sbom-attest

  - name: szl-sentra
    path: ../bundles/szl-sentra
    ref: "0.2.0"
    optionalComponents:
      - sentra-sbom-attest

  - name: szl-amaru
    path: ../bundles/szl-amaru
    ref: "0.2.0"
    optionalComponents:
      - amaru-sbom-attest
