kind: UDSBundle
metadata:
  name: a11oy
  description: "SZL a11oy command platform — orchestrating brain + backend organs (sentra/amaru/rosie) + mesh interconnect, one self-contained bundle"
  version: "0.5.0"
  architecture: amd64
  authors: "Stephen P. Lutar Jr. <stephenlutar2@gmail.com>"
  x-uds-core-compat: ">=1.5.0"
  x-zarf-compat: ">=0.77.0"
  annotations:
    szl.dev/role: "command-platform"
    szl.dev/fleet-deployable: "true"
    szl.dev/fleet-tier: "mission-application"

packages:
  # ── a11oy: THE command platform (front door / orchestrating brain) ─────────
  # Reuses the verified bundles/szl-a11oy Zarf package (zarf.yaml bakes
  # ghcr.io/szl-holdings/a11oy:uds-v0.2.0 + the a11oy UDS Package CR that
  # exposes the platform on the tenant gateway).
  - name: szl-a11oy
    path: ../szl-a11oy
    ref: "0.2.0"

  # ── sentra: policy / immune BACKEND (a11oy depends on it) ──────────────────
  - name: szl-sentra
    path: ../szl-sentra
    ref: "0.2.0"

  # ── amaru: reasoning / memory cortex BACKEND (a11oy depends on it) ─────────
  - name: szl-amaru
    path: ../szl-amaru
    ref: "0.2.0"

  # ── rosie: operator console BACKEND (a11oy depends on it) ──────────────────
  - name: szl-rosie
    path: ../szl-rosie
    ref: "0.2.0"

  # ── MESH INTERCONNECT ──────────────────────────────────────────────────────
  # NOT a separate package: the cross-organ mesh (Istio AuthorizationPolicy,
  # NetworkPolicy, strict PeerAuthentication) ships INSIDE each per-organ Zarf
  # package above as its UDS Package CR (manifests/uds-package.yaml). The UDS
  # Operator reconciles the allow/expose matrix
  #   a11oy <-> amaru (8080) · a11oy <-> sentra (8080) · a11oy -> rosie (7860)
  # so the mesh wiring deploys with this bundle. Span schemas (governance fabric)
  # live in szl-holdings/uds-mesh + uds-bundles/mesh/schemas/spans/*.yaml.

  # ── ROADMAP PREREQUISITES (authored as TODO — image NOT yet public) ────────
  # These are real prerequisites of the full a11oy platform but their GHCR
  # images are NOT anonymously pullable as of authoring (HTTP 403 = private or
  # not published). They are listed honestly as roadmap, NOT fake-pinned. Add a
  # bundles/szl-<svc> Zarf package + uncomment once the image is public + verified.
  #
  # OTEL — observability/telemetry collector (vsp-otel)
  #   image: ghcr.io/szl-holdings/vsp-otel:<tag>   STATUS: 403 (not public) — TODO
  # MCP — tool/agent gateway (hatun-mcp)  IMAGE IS PUBLIC (latest, pinned by digest
  #   above) but no Zarf package vendored yet in this repo — TODO: add bundles/szl-hatun-mcp.
  #   image: ghcr.io/szl-holdings/hatun-mcp@sha256:fba23f0e26886d6c6b99dfb834c72a0af89f83382ceaaeedfeedaab0feb8f247
  # RECEIPTS / LAKE — DSSE receipt server + evidence lake (szl-lake / szl-receipts-server)
  #   image: ghcr.io/szl-holdings/szl-lake:<tag>            STATUS: 403 — TODO
  #   image: ghcr.io/szl-holdings/szl-receipts-server:<tag> STATUS: 403 — TODO
  #   (the a11oy/amaru/sentra/rosie UDS Package CRs ALREADY carry permissive allow
  #    rules to the szl-receipts namespace; traffic simply does not flow until the
  #    receipts service is deployed — see DEPLOY.md troubleshooting.)
  # KNOWLEDGE / DOCTRINE — knowledge.json + 100 formula LaTeX + 10 policy yamls are
  #   already BAKED INTO the a11oy image (ingested into the a11oy repo), so they
  #   deploy with szl-a11oy above — no separate package required.
