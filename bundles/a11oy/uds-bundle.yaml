# WHAT THIS BUNDLE IS
#   a11oy is THE orchestrating brain / command platform. It ingested the organ
#   source and now runs as the front door. This bundle deploys a11oy together
#   with the backend organs it depends on AND the mesh interconnect that wires
#   them — everything a11oy needs to run as the orchestrating brain, in ONE
#   air-gap-deployable bundle:
#     - a11oy     (command platform + 26-tab console + orchestration)
#     - sentra    (policy / immune system — BACKEND a11oy depends on)
#     - amaru     (reasoning / memory cortex — BACKEND a11oy depends on)
#     - rosie     (operator console / ask-&-act — BACKEND a11oy depends on)
#   The mesh interconnect (Istio AuthorizationPolicy + NetworkPolicy + strict
#   PeerAuthentication) is carried INSIDE each per-organ Zarf package as a UDS
#   Package CR (manifests/uds-package.yaml). The UDS Operator reconciles those
#   CRs into the cross-organ allow/expose matrix at deploy time, so the mesh
#   wiring deploys WITH the bundle. The cross-organ allow/expose matrix is the
#   one authored in szl-uds-deployment/packages/*/uds-package.yaml.
#
# PUBLISH NOTE (HONEST — read before claiming anything):
#   The GHCR repo `ghcr.io/szl-holdings/a11oy` ALREADY holds the a11oy ORGAN
#   IMAGE (a11oy:uds-v0.2.0, verified pullable). A UDSBundle published to that
#   same repo path would collide image-vs-bundle. This bundle is therefore
#   intended to publish to a DISTINCT path: oci://ghcr.io/szl-holdings/a11oy-bundle:0.5.0.
