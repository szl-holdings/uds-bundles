# UDS Core declarative bundle spec — szl-rosie
# Author: Yachay <yachay@szlholdings.dev> (DCO signed)
# Doctrine v11 LOCKED 749/14/163
# Operational drop: fills the UDS Core gap — adds human-in-loop layer UDS Core lacks.
kind: UDSBundle
metadata:
  name: szl-rosie
  description: "SZL Rosie operational UDS drop — Operator console + decision approval gates"
  version: "0.1.0"
  architecture: amd64
  authors: "Yachay <yachay@szlholdings.dev>"

packages:
  - name: szl-rosie
    # Local path for air-gap create; OCI ref for registry-backed deploy.
    path: .
    ref: 0.1.0
    # Cosign: verify the package signature against the published public key
    # (see README — cosign verify-blob). Private key lives in HF Space secrets.
    optionalComponents:
      - rosie-sbom-attest
    overrides:
      rosie:
        rosie:
          values:
            - path: image.tag
              value: "uds-v0.1.0"
            - path: namespace
              value: "szl-rosie"
