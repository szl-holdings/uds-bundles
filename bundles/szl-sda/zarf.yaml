# SPDX-License-Identifier: Apache-2.0
# Zarf package definition — szl-sda (killinchu SDA / khipu-sda-core)
# Author: Yachay <yachay@szlholdings.dev> (DCO signed)
# Doctrine v11 LOCKED 749/14/163
# OPERATIONAL: deploy in 60s, pull the network cable, it still works.
# Clean-room anomaly/SDA capability INSPIRED BY True Anomaly's Mosaic (no proprietary code).
kind: ZarfPackageConfig
metadata:
  name: szl-sda
  version: 0.4.0
  description: "killinchu SDA — Sovereign Domain-Awareness layer (khipu-sda-core): clean-room multivariate + graph anomaly / Threat-Warning engine. Λ-gated (Conjecture 1, advisory) DSSE provenance receipts into the Khipu DAG."
  architecture: amd64
  authors: "Yachay <yachay@szlholdings.dev>"
  source: "https://github.com/szl-holdings/khipu-sda-core"
  url: "https://github.com/szl-holdings/killinchu"
  # Air-gap: all images + charts are baked into the .tar.zst; no pull at deploy time.
  yolo: false

components:
  - name: szl-sda-runtime
    required: true
    description: "Clean-room anomaly/SDA engine (khipu-sda-core): IsolationForest (PyOD-lineage BSD-2) + Autoencoder (Merlion/TODS-lineage BSD-3/Apache-2) + RobustZScore (tsod-lineage MIT) + GraphDeviation (GDN/PyGOD-lineage MIT/BSD-2) ensemble; scores tracks; emits an advisory Λ-gated, conformal-CI (ESTIMATE), in-toto receipt. Orbital-SDA (python-sgp4 MIT) is roadmap, off by default."
    charts:
      - name: szl-sda
        namespace: szl-sda
        localPath: ./chart
        version: 0.4.0
        valuesFiles:
          - ./chart/values.yaml
    images:
      - "ghcr.io/szl-holdings/khipu-sda-core:uds-v0.4.0"
    # Pepr admission policies applied as raw manifests at deploy time.
    manifests:
      - name: szl-sda-pepr-policies
        namespace: szl-sda
        files:
          - ./policies/namespace-isolation.yaml
          - ./policies/dsse-receipt-egress.yaml
          - ./policies/section889-denylist.yaml
          # K8s-native additive gates (alongside Pepr; Audit/warn during rollout)
          - ./policies/lambda-gate.vap.yaml
          - ./policies/cosign-image-policy.yaml

  - name: szl-sda-sbom-attest
    required: false
    description: "SBOM (SPDX 2.3 + CycloneDX 1.4) and SLSA L1 provenance, shipped in-bundle. Generated by Forge at build time; placeholders here are honest stubs (NOT signatures)."
    files:
      - source: ./sbom/khipu-sda-core.spdx.json
        target: ./sbom/khipu-sda-core.spdx.json
      - source: ./sbom/khipu-sda-core.cyclonedx.json
        target: ./sbom/khipu-sda-core.cyclonedx.json
      - source: ./attestations/khipu-sda-core.slsa-provenance.json
        target: ./attestations/khipu-sda-core.slsa-provenance.json

  - name: szl-sda-uds-package
    required: true
    description: "UDS Package CR — registers szl-sda with UDS Operator for Istio, NetworkPolicy, SSO, and monitoring"
    manifests:
      - name: szl-sda-uds-package
        namespace: szl-sda
        files:
          - ./manifests/uds-package.yaml
