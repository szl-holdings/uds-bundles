{{/* killinchu SDA / khipu-sda-core deployment. Clean-room anomaly/SDA engine. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: szl-sda
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: szl-sda
    app.kubernetes.io/part-of: szl-mesh
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: szl-sda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: szl-sda
        app.kubernetes.io/part-of: szl-mesh
        app: szl-sda
        # Λ-gate / receipt-egress gate (fail-CLOSED): egress allowed only for
        # workloads that emit a signed DSSE receipt (see policies/).
        dsse-receipt: required
        {{- if .Values.istio.enabled }}
        istio.io/rev: default
        {{- end }}
      annotations:
        {{- if .Values.monitoring.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: {{ .Values.monitoring.path | quote }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        seccompProfile:
          type: {{ .Values.securityContext.seccompProfile.type }}
      containers:
        - name: szl-sda
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          # Digest unset until Forge cosign-signs uds-v0.4.0 (FA-001). Tag-pinned only — honest.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: SDA_ALLOW_THRESHOLD, value: {{ .Values.sda.allowThreshold | quote }}}
            - {name: SDA_DENY_THRESHOLD, value: {{ .Values.sda.denyThreshold | quote }}}
            - {name: SDA_CONFORMAL_ALPHA, value: {{ .Values.sda.conformalAlpha | quote }}}
            - {name: SDA_ORBITAL_ROADMAP_ENABLED, value: {{ .Values.sda.orbitalRoadmapEnabled | quote }}}
          ports:
            - {name: http, containerPort: {{ .Values.service.port }}}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop: {{ .Values.securityContext.capabilities.drop | toJson }}
          readinessProbe:
            httpGet: {path: {{ .Values.healthPath | quote }}, port: {{ .Values.service.port }}}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: {{ .Values.healthPath | quote }}, port: {{ .Values.service.port }}}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {{ .Values.resources.requests | toJson }}
            limits: {{ .Values.resources.limits | toJson }}
---
apiVersion: v1
kind: Service
metadata:
  name: szl-sda
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: szl-sda
spec:
  selector:
    app.kubernetes.io/name: szl-sda
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: {{ .Values.service.port }}}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: szl-sda-default-deny
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: szl-sda
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - {protocol: TCP, port: {{ .Values.service.port }}}
{{- end }}
{{- if and .Values.istio.enabled .Values.istio.hardened }}
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: szl-sda-strict-mtls
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: szl-sda
  mtls:
    mode: STRICT
{{- end }}
{{- if .Values.monitoring.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: szl-sda
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: szl-sda
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: szl-sda
  podMetricsEndpoints:
    - port: http
      path: {{ .Values.monitoring.path | quote }}
      interval: {{ .Values.monitoring.interval }}
{{- end }}
