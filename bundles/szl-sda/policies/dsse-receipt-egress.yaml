# SPDX-License-Identifier: Apache-2.0
# Pepr policy — DSSE-receipt-required egress for szl-sda (killinchu SDA).
# Egress is DENIED unless the workload carries the dsse-receipt=required label,
# enforcing that any SDA anomaly/threat verdict leaving the namespace emits a signed receipt.
# Author: Yachay <yachay@szlholdings.dev> (DCO signed). Doctrine v11 LOCKED 749/14/163.
apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: szl-sda-dsse-egress
  namespace: szl-sda
spec:
  network:
    allow:
    # @lulaStart 5e1c0d7a-9a4b-4f2e-8c3d-1b2a3c4d5e6f   # NIST SP 800-53 AC-4 / AU-10 mapping (validate with Lula, Apache-2.0)
    # https://github.com/defenseunicorns/lula
      - direction: Egress
        selector:
          dsse-receipt: required
        remoteGenerated: KubeAPI
        description: "Egress permitted ONLY for workloads emitting cosign-signed DSSE receipts"
    # @lulaEnd 5e1c0d7a-9a4b-4f2e-8c3d-1b2a3c4d5e6f
  # Workloads without the dsse-receipt label inherit default-deny egress (fail-CLOSED).
