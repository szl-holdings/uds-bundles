# SPDX-License-Identifier: Apache-2.0
# ClusterImagePolicy — require a cosign signature on every khipu-sda-core image. Fail-CLOSED.
# sigstore/policy-controller v0.15.1 (Apache-2.0). Defaults to deny on no-match.
# https://docs.sigstore.dev/policy-controller/overview/
#
# Authority model (OR'd by policy-controller — image satisfies the policy if it matches EITHER):
#   * szl-keyless  — the AUTHORITATIVE / LIVE signing path. khipu-sda-core's
#                    .github/workflows/cosign.yml signs images keyless via GitHub OIDC
#                    (Sigstore Fulcio + Rekor); no COSIGN_PRIVATE_KEY secret is set, so
#                    keyless is what actually runs. Verified in CI with
#                    `cosign verify --certificate-identity-regexp ... --certificate-oidc-issuer ...`.
#   * szl-key      — OPTIONAL / LEGACY ECDSA-P256 key-pair path. PUBLIC half below is the
#                    uds-bundles signing key, SHA-256(DER SPKI) daa4aeca…7cb40b (committed at
#                    uds-bundles/bundles/v0.1.0/cosign_signing_key.pub). It is NOT the org key
#                    a1f6d323…2826ab (szl-holdings/.github/cosign.pub) — distinct keys; no a11oy
#                    infra/build-env/keys/cosign.pub exists. Effective only if an operator later
#                    provisions COSIGN_PRIVATE_KEY. PUBLIC KEY ONLY — never commit private.
#                    See COSIGN_KEYS.md.
#
# MODE: warn (rollout). Flip to enforce ONLY after a green dress rehearsal —
# see szl-uds-deployment/UDS_DEPLOY_RUNBOOK.md "warn -> enforce" section.
# NOTE: this is a NEW uds-v0.4.0 artifact; it does NOT alter any published v0.2.0 policy/signature.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: szl-sda-cosign
spec:
  images:
    - glob: "ghcr.io/szl-holdings/khipu-sda-core**"
  authorities:
    # AUTHORITATIVE — keyless (GitHub Actions OIDC via Fulcio/Rekor).
    - name: szl-keyless
      keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subjectRegExp: "https://github.com/szl-holdings/khipu-sda-core/.*"
    # OPTIONAL / LEGACY — keyed ECDSA-P256. PUBLIC half of the uds-bundles signing
    # key (daa4aeca…7cb40b), NOT the org key (a1f6d323…2826ab). See COSIGN_KEYS.md.
    - name: szl-key
      key:
        data: |
          -----BEGIN PUBLIC KEY-----
          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE7mrYWDnz8TvT7o4/65XGqYxo9OoV
          vaB/grNuz+kVP1Xsaw0RokBKG0xT/XlV5Fz90AOwtgqC2yMBP0blK455gQ==
  mode: warn                                  # warn during rollout -> flip to enforce after dress rehearsal
