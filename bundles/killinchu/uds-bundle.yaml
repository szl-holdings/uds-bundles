kind: UDSBundle
metadata:
  name: killinchu
  description: "SZL killinchu field node — counter-UAS + vessels + inherited a11oy orchestration, with sentra/amaru governance prerequisites, one self-contained edge bundle"
  version: "0.5.0"
  architecture: amd64
  # NOTE: uds-cli v0.32.0 strict UDSBundle metadata schema accepts ONLY
  #   name/description/version/architecture. The following were moved to
  #   comments (strict unmarshalling rejects unknown fields):
  #     authors: "Stephen P. Lutar Jr. <stephenlutar2@gmail.com>"
  #     x-uds-core-compat: ">=1.5.0"   x-zarf-compat: ">=0.77.0"
  #     szl.dev/role: "field-node"
  #     szl.dev/deployable-to-edge: "true"   szl.dev/ddil-ok: "true"
  #     szl.dev/fleet-tier: "mission-application"
  #     szl.dev/edge-profile: "ddil"

packages:
  # ── killinchu: THE field surface (drones + vessels + inherited a11oy brain) ─
  # Reuses the verified bundles/szl-killinchu Zarf package (bakes
  # ghcr.io/szl-holdings/killinchu:uds-v0.2.0 + its UDS Package CR). The killinchu
  # image carries the inherited a11oy orchestration/console + a REAL cosign key,
  # so edge receipts are genuinely signed offline.
  - name: szl-killinchu
    path: ../szl-killinchu
    ref: "0.2.0"

  # ── sentra: policy / immune BACKEND (interdiction screening at the edge) ───
  - name: szl-sentra
    path: ../szl-sentra
    ref: "0.2.0"

  # ── amaru: reasoning / 13-axis Λ-gate memory (threat scoring) ──────────────
  - name: szl-amaru
    path: ../szl-amaru
    ref: "0.2.0"

  # ── rosie operator console — OPTIONAL at a field node ──────────────────────
  # killinchu's inherited operator views cover the field case. Uncomment to add a
  # full standalone operator console organ (image verified pullable, uds-v0.2.0,
  # sha256:1984a15f53c2e1b91c7dafaa0ed5df9148d57e3e86eb73db879c2b0443302848).
  # - name: szl-rosie
  #   path: ../szl-rosie
  #   ref: "0.2.0"

  # ── MESH INTERCONNECT ──────────────────────────────────────────────────────
  # Ships inside each per-organ Zarf package as its UDS Package CR
  # (manifests/uds-package.yaml). The UDS Operator reconciles the field
  # allow/expose matrix (killinchu <-> sentra verdicts, killinchu <-> amaru
  # memory, deny-by-default everywhere else) at deploy time.

  # ── ROADMAP PREREQUISITES (authored as TODO — image NOT yet public) ────────
  # Same honest status as a11oy.uds: a field node would also carry OTEL +
  # receipts/lake once those images are public. NOT fake-pinned.
  #   OTEL:     ghcr.io/szl-holdings/vsp-otel:<tag>             403 (not public) — TODO
  #   RECEIPTS: ghcr.io/szl-holdings/szl-receipts-server:<tag>  403 (not public) — TODO
  #   LAKE:     ghcr.io/szl-holdings/szl-lake:<tag>             403 (not public) — TODO
  #   (killinchu signs receipts locally with its in-image cosign key regardless;
  #    a central receipts sink is additive, not required for the field node to work.)
